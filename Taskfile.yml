# Single source of truth for every command.
# Git hooks (lefthook) and GitHub Actions call ONLY `task <name>` — never inline
# shell — so local and CI run identical code paths. Tool versions come from mise.
#
# Every gate FAILS on findings; accepted findings live in .semgrepignore /
# `nosemgrep` comments with a written reason.
version: "3"

vars:
  CONTRACT: api/openapi.yaml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Aggregate gates
  # ---------------------------------------------------------------------------
  check:
    desc: "Fast pre-commit gate: format, lint, typecheck, spec lint, contract compat, gen-drift, secrets, unit"
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: spec:lint
      - task: contract:compat
      - task: gen:check
      - task: security:secrets
      - task: test:unit

  ci:
    desc: "Full gate — runs IDENTICALLY locally and in GitHub Actions"
    cmds:
      - task: check
      - task: build
      - task: test:package
      - task: test:mock
      - task: security:deps

  # ---------------------------------------------------------------------------
  # Code quality
  # ---------------------------------------------------------------------------
  format:
    desc: Auto-format all files
    cmds:
      - pnpm format
  format:check:
    desc: Check formatting
    cmds:
      - pnpm format:check
  lint:
    desc: Lint (eslint + security plugin)
    cmds:
      - pnpm lint
  typecheck:
    desc: TypeScript typecheck
    cmds:
      - pnpm typecheck
  build:
    desc: Build the package (ESM + CJS + d.ts for every subpath export)
    cmds:
      - pnpm build

  # ---------------------------------------------------------------------------
  # Contract & codegen
  # ---------------------------------------------------------------------------
  spec:lint:
    desc: Lint the OpenAPI contract (Redocly rules incl. lower_snake_case)
    cmds:
      - pnpm exec redocly lint {{.CONTRACT}}
  contract:compat:
    desc: "Fail on BREAKING contract changes vs the base branch (oasdiff). CONTRACT_BASE_REF overrides the base; CONTRACT_ALLOW_BREAKING=true accepts them (needs a feat!: commit)"
    cmds:
      - ./scripts/contract-compat.sh
  contract:path:
    desc: Print the absolute path of the contract
    silent: true
    cmds:
      - node scripts/contract-path.mjs
  gen:
    desc: "Regenerate everything from the contract (types, zod, client, .http collection, API reference)"
    cmds:
      - task: spec:lint
      - pnpm gen
      - task: gen:httpfiles
      - task: docs:api
  gen:httpfiles:
    desc: Generate the .http request collection + env file from the contract
    cmds:
      - node scripts/gen-http-collection.mjs
  gen:check:
    desc: Fail if generated artifacts are stale (contract drift gate)
    vars:
      # Every path `task gen` writes. `git status --porcelain` (not `git diff`)
      # so brand-new untracked files count as drift too.
      GEN_PATHS: src/generated collections docs/api-reference
    cmds:
      - task: gen
      - |
        drift="$(git status --porcelain -- {{.GEN_PATHS}})"
        if [ -n "$drift" ]; then
          echo "Generated artifacts are stale. Run 'task gen' and commit:"
          echo "$drift"
          exit 1
        fi
  docs:api:
    desc: Build the static API reference site from the contract
    cmds:
      - pnpm exec redocly build-docs {{.CONTRACT}} -o docs/api-reference/index.html
  version:set:
    desc: "Set the contract's info.version and package.json version to VERSION=<x.y.z> (run by semantic-release)"
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "Pass VERSION=<x.y.z>"
    cmds:
      - node scripts/set-version.mjs {{.VERSION}}

  # ---------------------------------------------------------------------------
  # Mock (Prism) — for consumers, and as a contract self-consistency check
  # ---------------------------------------------------------------------------
  mock:
    desc: "Serve the contract as a mock API on http://127.0.0.1:4010 (Prism)"
    cmds:
      - pnpm exec prism mock -h 127.0.0.1 -p 4010 {{.CONTRACT}}

  # ---------------------------------------------------------------------------
  # Tests (see docs/testing)
  # ---------------------------------------------------------------------------
  test:
    desc: Run unit + package + mock tests
    cmds:
      - task: test:unit
      - task: test:package
      - task: test:mock
  test:unit:
    desc: "Unit tests: the .http generator, the client wrapper, version sync"
    cmds:
      - pnpm test:unit
  test:package:
    desc: "Package test: pack the tarball, install it into a scratch project, import every export (ESM + CJS) and resolve the shipped spec + collection"
    cmds:
      - task: build
      - pnpm test:package
  test:mock:
    desc: "Contract self-consistency: replay the generated .http collection against a Prism mock of the same contract; every status must be one the contract declares"
    cmds:
      - node scripts/mock-check.mjs

  # ---------------------------------------------------------------------------
  # Security scanning
  # ---------------------------------------------------------------------------
  security:
    desc: Run all security scans
    cmds:
      - task: security:secrets
      - task: security:deps
      - task: security:code
      - task: sbom
  security:secrets:
    desc: Secret scanning (gitleaks)
    cmds:
      - gitleaks detect --no-banner --redact
  security:deps:
    desc: Dependency & filesystem vulnerability scan (trivy)
    cmds:
      - trivy fs --scanners vuln,misconfig --exit-code 1 --severity HIGH,CRITICAL --skip-dirs "**/node_modules" --skip-dirs "**/dist" .
  security:code:
    desc: "Static analysis (semgrep) — fails on findings; suppress with a nosemgrep comment + reason"
    cmds:
      - mkdir -p test-results
      - semgrep --config auto --error --metrics=on --text --json-output=test-results/semgrep.json
  sbom:
    desc: Generate a CycloneDX SBOM
    cmds:
      - trivy fs --format cyclonedx --output sbom.cdx.json .

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    desc: "semantic-release: version (also written into the contract's info.version), changelog, tag, GitHub release, npm publish to GitHub Packages"
    cmds:
      - pnpm exec semantic-release -e ./.releaserc.json

  hooks:install:
    desc: Install the git hooks (also runs automatically on `pnpm install`)
    cmds:
      - lefthook install

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # gitleaks scans history; oasdiff needs the base branch
          persist-credentials: false

      # Installs every tool pinned in .mise.toml, so CI uses the SAME versions
      # as local dev and the git hooks.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates below are exactly the sub-tasks of `task ci` (what the pre-push
      # hook runs), one step each so the Actions UI shows which gate failed.
      - name: "check: format, lint, typecheck, spec lint, contract compat, gen drift, secrets, unit"
        run: task check
      - name: "build: ESM + CJS + d.ts"
        run: task build
      - name: "test: packed tarball installs and every export resolves"
        run: task test:package
      - name: "test: generated collection replays against the Prism mock"
        run: task test:mock
      - name: "dependencies: vulnerability scan (trivy)"
        run: task security:deps

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

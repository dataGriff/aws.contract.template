name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # semantic-release decides the version from conventional commits, writes it
  # into api/openapi.yaml (info.version) + package.json, regenerates the
  # committed artifacts, publishes the package to GitHub Packages, commits the
  # changelog and tags the release. `feat!:` / BREAKING CHANGE => new major.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, releases, changelog commit
      issues: write
      pull-requests: write
      packages: write # npm publish to GitHub Packages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { install: true, cache: true }
      - run: pnpm install --frozen-lockfile
      # NOTE: @semantic-release/git pushes a release commit to main. If main is
      # branch-protected, allow the GITHUB_TOKEN (or a deploy key/app token) to
      # bypass the rule, or drop the git plugin from .releaserc.json.
      # semantic-release commits the changelog (and regenerated files) itself;
      # the repo's pre-commit hook (task check) must not run inside that commit —
      # its drift gate would see the release's own staged changes as stale.
      - name: Semantic release + publish
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @semantic-release/npm authenticates to the registry in publishConfig
          # (npm.pkg.github.com) with NPM_TOKEN; the workflow token is enough.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release

  docs:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The release job may have pushed a new commit; publish main's current
      # head so the reference matches the released version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: main, persist-credentials: false }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { install: true, cache: true }
      - run: pnpm install --frozen-lockfile
      - name: Build API reference
        run: task docs:api
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with: { path: docs/api-reference }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
